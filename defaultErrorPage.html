<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>Error {{.Code}}</title>
	<style>
		:root {
			color-scheme: light dark;
			--c0: light-dark(#ffffff, #181818); /* Default Background */
			--c1: light-dark(#ebebeb, #1c1c1c); /* Lighter Background */
			--c2: light-dark(#cdcdcd, #2d2d2d); /* Selection Background */
			--c3: light-dark(#474747, #b9b9b9); /* Default Foreground */
			--c4: light-dark(#0064e4, #368aeb); /* Default Link */
			--c5: light-dark(#7f51d6, #a580e2); /* Visited Blue */
		}

		* {
			font-size: 16px;
			color: var(--c3);
			margin: 0;
			padding: 0;
		}

		html {
			height: 100%;
		}

		body {
			background-color: var(--c0);
			display: flex;
			justify-content: space-between;
			flex-wrap: nowrap;
			flex-direction: column;
			height: 100%;
		}

		a {
			text-decoration: none;
			color: var(--c4);
		}

		a:visited {
			color: var(--c5);
			text-decoration: none;
		}

		main {
			flex-grow: 1;
			padding: 1em 1em;
		}

		footer {
			font-size: 75%;
			background-color: var(--c1);
			border-top: 1px solid var(--c2);
			padding: .5em;
		}

		footer * {
			font-size: 100%;
		}

		h1 {
			margin-top: 1em;
			font-size: 150%;
			margin-bottom: 0.5em;
		}

		p {
			margin-bottom: 0.5em;
		}

		pre {
			font-family: monospace;
			font-size: 75%;
			border: 1px solid var(--c2);
			background-color: var(--c1);
			margin-bottom: 0.5em;
			padding: 0.5em;
		}
	</style>
</head>

<body>
	<main>
		<h1>Error {{.Code}}</h1>
		<p>Info:</p>
		<pre>{{.Text}}</pre>
	</main>
	<footer>
		Reply by <a href="https://github.com/nxshock/gonx">gonx</a>
	</footer>
</body>

</html>
