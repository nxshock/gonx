<html>

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
	<title>Error {{.Code}}</title>
	<style>
		:root {
			color-scheme: light dark;
			--c0: light-dark(#ffffff, #181818); /* Default Background */
			--c1: light-dark(#ebebeb, #1c1c1c); /* Lighter Background */
			--c2: light-dark(#cdcdcd, #2d2d2d); /* Selection Background */
			--c3: light-dark(#878787, #777777); /* Comments, Invisibles, Line Highlighting */
			--c4: light-dark(#878787, #777777); /* Dark Foreground (Used for status bars) */
			--c5: light-dark(#474747, #b9b9b9); /* Default Foreground, Caret, Delimiters, Operators */
			--c6: light-dark(#282828, #dedede); /* Light Foreground (Not often used) */
			--c7: light-dark(#282828, #dedede); /* Light Background (Not often used) */
			--c8: light-dark(#d6000c, #ed4a46); /* Red */
			--c9: light-dark(#d04a00, #e67f43); /* Orange */
			--cA: light-dark(#c49700, #dbb32d); /* Yellow */
			--cB: light-dark(#1d9700, #70b433); /* Green */
			--cC: light-dark(#00ad9c, #3fc5b7); /* Aqua */
			--cD: light-dark(#0064e4, #368aeb); /* Blue */
			--cE: light-dark(#7f51d6, #a580e2); /* Purple */
			--cF: light-dark(#eb6eb7, #eb6eb7); /* Dark red */
		}

		* {
			font-size: 16px;
			color: var(--c5);
			margin: 0;
			padding: 0;
		}

		html {
			height: 100%
		}

		body {
			background-color: var(--c0);
			display: flex;
			justify-content: space-between;
			flex-wrap: nowrap;
			flex-direction: column;
			height: 100%;
		}

		a {
			text-decoration: none;
			color: var(--cD);
		}

		main {
			flex-grow: 1;
			padding: 1em 1em;
		}

		footer {
			font-size: 75%;
			background-color: var(--c1);
			border-top: 1px solid var(--c2);
			padding: .5em;
		}

		footer * {
			font-size: 100%;
		}

		h1 {
			margin-top: 1em;
			font-size: 150%;
			margin-bottom: 0.5em;
		}

		p {
			margin-bottom: 0.5em;
		}

		pre {
			font-family: monospace;
			font-size: 75%;
			border: 1px solid var(--c2);
			background-color: var(--c1);
			margin-bottom: 0.5em;
			padding: 0.5em;
		}
	</style>
</head>

<body>
	<main>
		<h1>Error {{.Code}}</h1>
		<p>Info:</p>
		<pre>{{.Text}}</pre>
	</main>
	<footer>
		Reply by <a href="https://github.com/nxshock/gonx">gonx</a>
	</footer>
</body>

</html>
